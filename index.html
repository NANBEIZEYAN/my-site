<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的主页</title>
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      background-color: #f7f7f7;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #fff;
      padding: 40px 60px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
    }
    p {
      color: #888;
    }
    .red {
      color: #b23a2e;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>你好，我是 <span class="red">南北泽延</span></h1>
    <p>这是我的第一个网页</p >
  </div>
</body>
</html>
